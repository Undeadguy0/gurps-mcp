[workspace]
members = [".", "crates/gurps-calc", "tools/sheet-bridge"]
resolver = "3"

[package]
name = "gurps-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
gurps-calc = { path = "crates/gurps-calc" }
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
surrealdb = { version = "3.3.5", default-features = false, features = ["protocol-ws", "protocol-http"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
