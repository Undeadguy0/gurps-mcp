# Заклинания: школы, классы, сложность, сопротивление, has_spell.
name = "spells"
tags = ["spells"]

[[cases]]
name = "spell_ok"
kind = "sql_expect"
actor = "root"
sql = "CREATE spell:['basic', 't_s1'] SET colleges = [ref_college:college_a], classes = [ref_spell_class:regular, ref_spell_class:resisted], resist = ref_attribute:HT, difficulty = ref_difficulty:VH, casting_time = { raw: 'x' }, duration = { raw: 'x', kind: 'instant' }, cost = { raw: 'x' }, prereqs = { type: 'spells_from_college', college: ref_college:college_b, count: 1 } RETURN AFTER;"
allow = true

[[cases]]
name = "no_college_rejected"
kind = "sql_expect"
actor = "root"
sql = "CREATE spell:['basic', 't_s2'] SET colleges = [], classes = [ref_spell_class:regular], difficulty = ref_difficulty:H, casting_time = { raw: 'x' }, duration = { raw: 'x', kind: 'instant' }, cost = { raw: 'x' };"
allow = false
error_contains = "colleges"

