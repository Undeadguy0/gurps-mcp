# Типизированные features: 6 видов, проверка ссылок, op add/set.
name = "features"
tags = ["features"]

[[cases]]
name = "all_six_kinds_ok"
kind = "sql_expect"
actor = "root"
sql = "CREATE trait:['basic', 't_f1'] SET kind = 'adv', cost = { type: 'fixed' }, features = [{ kind: 'attribute_bonus', attribute: ref_attribute:ST, amount: 1 }, { kind: 'skill_bonus', category: ref_skill_category:melee, amount: 1 }, { kind: 'dr_bonus', amount: 2, damage_type: ref_damage_type:cr }, { kind: 'damage_bonus', skill: skill:['basic', 'sword_a'], amount: 1, per_die: true }, { kind: 'cost_reduction', attribute: ref_attribute:HT, percent: 20 }, { kind: 'reaction_bonus', amount: -1 }] RETURN AFTER;"
allow = true

[[cases]]
name = "unknown_kind_rejected"
kind = "sql_expect"
actor = "root"
sql = "CREATE trait:['basic', 't_f2'] SET kind = 'adv', cost = { type: 'fixed' }, features = [{ kind: 'luck_bonus', amount: 1 }];"
allow = false
error_contains = "features"

[[cases]]
name = "bad_attribute_target_rejected"
kind = "sql_expect"
actor = "root"
sql = "CREATE trait:['basic', 't_f3'] SET kind = 'adv', cost = { type: 'fixed' }, features = [{ kind: 'attribute_bonus', attribute: ref_attribute:LUCK, amount: 1 }];"
allow = false
error_contains = "features"

[[cases]]
