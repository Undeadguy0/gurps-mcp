# Справочники и ссылочная целостность. Тестовые записи создаются в изолированной тестовой БД.
name = "ref_integrity"
tags = ["refs"]

[[cases]]
name = "valid_item_accepted"
kind = "sql_expect"
actor = "root"
sql = "CREATE item:['basic', 't_ok'] SET category = 'melee', tl = ref_tl:TL2, attack_modes = [{ name: 'swing', damage: { raw: 'x', type: ref_damage_type:cut } }] RETURN AFTER;"
allow = true

[[cases]]
name = "typo_damage_type_rejected"
kind = "sql_expect"
actor = "root"
sql = "CREATE item:['basic', 't_dt'] SET category = 'melee', attack_modes = [{ name: 'swing', damage: { type: ref_damage_type:cutt } }];"
allow = false
error_contains = "damage.type"

[[cases]]
name = "string_damage_type_rejected"
kind = "sql_expect"
actor = "root"
sql = "CREATE item:['basic', 't_sdt'] SET category = 'melee', attack_modes = [{ name: 'swing', damage: { type: 'cut' } }];"
allow = false
error_contains = "damage.type"

[[cases]]
name = "bad_damage_modifier_rejected"
kind = "sql_expect"
actor = "root"
sql = "CREATE item:['basic', 't_mod'] SET category = 'melee', attack_modes = [{ name: 'swing', damage: { type: ref_damage_type:cut, modifiers: [ref_damage_modifier:nope] } }];"
allow = false
error_contains = "modifiers"

[[cases]]
name = "nonexistent_hit_location_rejected"
kind = "sql_expect"
actor = "root"
sql = "CREATE item:['basic', 't_loc'] SET category = 'armor', armor = { locations: [{ loc: ref_hit_location:tentacle, dr: 1 }] };"
allow = false
error_contains = "loc"

[[cases]]
name = "bad_lc_rejected"
kind = "sql_expect"
actor = "root"
sql = "CREATE item:['basic', 't_lc'] SET category = 'gear', lc = ref_lc:LC9;"
allow = false
error_contains = "lc"

[[cases]]
name = "lc_level_out_of_range_rejected"
kind = "sql_expect"
actor = "root"
sql = "CREATE ref_lc:LC9 SET code = 'LC9', level = 9, pack = pack:basic;"
allow = false
error_contains = "level"

[[cases]]
name = "ref_code_must_match_id"
kind = "sql_expect"
actor = "root"
sql = "CREATE ref_damage_type:test_x SET code = 'other', pack = pack:basic;"
allow = false
error_contains = "code"

[[cases]]
name = "bad_skill_attribute_rejected"
kind = "sql_expect"
actor = "root"
sql = "CREATE skill:['basic', 't_attr'] SET attribute = ref_attribute:LUCK, difficulty = ref_difficulty:A;"
allow = false
error_contains = "attribute"

[[cases]]
name = "technique_difficulty_E_rejected"
kind = "sql_expect"
actor = "root"
sql = "CREATE technique:['basic', 't_t'] SET parent_skill = skill:['basic', 'sword_a'], difficulty = ref_difficulty:E, default_mod = -2;"
allow = false
error_contains = "difficulty"

[[cases]]
name = "string_id_rejected"
kind = "sql_expect"
actor = "root"
sql = "CREATE skill:plain SET attribute = ref_attribute:DX, difficulty = ref_difficulty:A;"
allow = false
error_contains = "id"

[[cases]]
name = "unknown_pack_in_id_rejected"
kind = "sql_expect"
actor = "root"
sql = "CREATE skill:['nopack', 'x'] SET attribute = ref_attribute:DX, difficulty = ref_difficulty:A;"
allow = false
error_contains = "pack"

[[cases]]
name = "sid_and_pack_derived_from_id"
kind = "sql_expect"
actor = "root"
sql = "CREATE skill:['homebrew', 't_der'] SET attribute = ref_attribute:DX, difficulty = ref_difficulty:A; IF (SELECT VALUE sid FROM ONLY skill:['homebrew', 't_der']) != 't_der' { THROW 'sid' };"
allow = true

[[cases]]
name = "effective_prefers_higher_priority"
kind = "sql_expect"
actor = "root"
sql = "IF fn::effective('skill', 'sword_a').id != skill:['homebrew', 'sword_a'] { THROW 'override' };"
allow = true

[[cases]]
name = "shield_requires_shield_block"
kind = "sql_expect"
actor = "root"
sql = "CREATE item:['basic', 't_sh'] SET category = 'shield';"
allow = false
error_contains = "shield"

[[cases]]
