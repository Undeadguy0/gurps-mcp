[package]
name = "sheet-bridge"
version = "0.1.0"
edition = "2021"
description = "Конвертер gurps-sheet (TOML/.ftl/.gurps.json) <-> SurrealDB (схема Data/database)"
license = "GPL-3.0-only"
publish = false

[dependencies]
gurps-db = { path = "../../crates/gurps-db" }
surrealdb = { version = "=3.3.5", default-features = false, features = ["protocol-ws", "protocol-http"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
fluent-syntax = "0.12"
anyhow = "1"
thiserror = "1"

[dev-dependencies]
