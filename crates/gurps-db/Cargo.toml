[package]
name = "gurps-db"
version = "0.1.0"
edition = "2024"
description = "Доступ к SurrealDB GURPS: подключение, вход расчёта (gurps-calc), чтение каталога. Общий для gurps-mcp и gurps-sheet"
publish = false

[features]
# Тестовый стенд: `surreal start memory` на свободном порту + surrealkit sync/seed.
testkit = ["dep:tokio"]

[dependencies]
gurps-calc = { path = "../gurps-calc" }
surrealdb = { version = "=3.3.5", default-features = false, features = ["protocol-ws", "protocol-http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }